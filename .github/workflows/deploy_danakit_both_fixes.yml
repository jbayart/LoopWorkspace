name: Deploy both DanaKit fixes to TestFlight
run-name: TestFlight - both DanaKit fixes
on:
  push:
    branches: ["deploy/danakit-both-fixes"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: loop-testflight
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout the combined source revision
        uses: actions/checkout@v5
        with:
          ref: c8a20ba0149c86b78292da0c6f71c017caab304b
          submodules: recursive
          persist-credentials: false
      - name: Verify source revisions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c8a20ba0149c86b78292da0c6f71c017caab304b"
          test "$(git -C DanaKit rev-parse HEAD)" = "ce9efc5e1cbad6f70902c23366c299cb0fa54807"
          test "$(git -C Loop rev-parse HEAD)" = "c30b5c89b1dc4151628f33f1384dd4796eaeeec2"
          test "$(git -C LoopKit rev-parse HEAD)" = "d9f1437353482690426bd981536f58c1e95ff535"
          git submodule status --recursive | tee source-revisions.txt
          {
            echo "LoopWorkspace source: c8a20ba0149c86b78292da0c6f71c017caab304b"
            echo "DanaKit: ce9efc5e1cbad6f70902c23366c299cb0fa54807"
            echo "Both the connection request and bolus progress queue fixes are included."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Select validated Xcode version
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
      - name: Checkout reviewed connection regression tests
        uses: actions/checkout@v5
        with:
          repository: jbayart/DanaKit
          ref: 9bbb5f319b3edae1f25b5a16e6b6a16ba631ecd1
          path: connection-validation
          persist-credentials: false
      - name: Run connection regressions against the combined source
        shell: bash
        run: |
          set -euo pipefail
          cp DanaKit/Common/Locked.swift connection-validation/Common/Locked.swift
          cp DanaKit/DanaKit/PumpManager/InteractiveBluetoothManager.swift connection-validation/DanaKit/PumpManager/InteractiveBluetoothManager.swift
          bash connection-validation/Scripts/test-connection-requests.sh
          bash connection-validation/Scripts/test-connection-requests.sh --sanitize=thread
      - name: Checkout reviewed bolus progress tests
        uses: actions/checkout@v5
        with:
          repository: jbayart/DanaKit
          ref: e8152cda5f62851ebf0c44db2d27161a67f5bce6
          path: progress-validation
          persist-credentials: false
      - name: Run bolus progress regressions against the combined source
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$(mktemp -d)"
          mkdir -p "$package_dir/Sources/LoopKit" "$package_dir/Sources/DanaProgress" "$package_dir/Tests/DanaProgressTests"
          cp LoopKit/LoopKit/WeakSet.swift LoopKit/LoopKit/UnfairLock.swift LoopKit/LoopKit/DeviceManager/DoseProgressReporter.swift "$package_dir/Sources/LoopKit/"
          cp DanaKit/Common/Locked.swift DanaKit/DanaKit/PumpManager/DanaKitDoseProgressReporter.swift "$package_dir/Sources/DanaProgress/"
          cp progress-validation/Validation/BolusProgressTests.swift "$package_dir/Tests/DanaProgressTests/"
          cat > "$package_dir/Package.swift" <<'SWIFT'
          // swift-tools-version: 6.0
          import PackageDescription
          let package = Package(
              name: "DanaProgressTests",
              targets: [
                  .target(name: "LoopKit"),
                  .target(name: "DanaProgress", dependencies: ["LoopKit"]),
                  .testTarget(name: "DanaProgressTests", dependencies: ["DanaProgress", "LoopKit"])
              ],
              swiftLanguageModes: [.v5]
          )
          SWIFT
          swift test --package-path "$package_dir"
          swift test --package-path "$package_dir" --sanitize=thread
      - name: Install Ruby and project dependencies
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Patch Match tables as in the existing build workflow
        shell: bash
        run: |
          TABLE_PRINTER_PATH=$(bundle exec ruby -e 'puts Gem::Specification.find_by_name("fastlane").gem_dir')/match/lib/match/table_printer.rb
          test -f "$TABLE_PRINTER_PATH"
          sed -i "" "/puts(Terminal::Table.new(params))/d" "$TABLE_PRINTER_PATH"
      - name: Sync clock
        run: sudo sntp -sS time.windows.com
      - name: Fastlane Build and Archive
        run: bundle exec fastlane build_loop
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      - name: Fastlane upload to TestFlight
        run: bundle exec fastlane release
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      - name: Upload build logs and symbols
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-danakit-both-fixes
          path: |
            artifacts
            buildlog
            source-revisions.txt
            *.dSYM.zip
